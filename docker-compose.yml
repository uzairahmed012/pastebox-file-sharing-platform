version: '3.9'

networks:
  pastebox-network:
    driver: bridge

services:
  mongodb:
    image: mongo:7
    container_name: pastebox-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pastebox-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pastebox-server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/pastebox
      PORT: 5000
      NODE_ENV: production
      AWS_REGION: us-east-1
      AWS_BUCKET_NAME: pastebox-uploads
    secrets:
      - jwt_secret
      - aws_access_key_id
      - aws_secret_access_key
      - mail_user
      - mail_pass
    networks:
      - pastebox-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pastebox-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    ports:
      - "80:80"
    networks:
      - pastebox-network

  selenium-tests:
    build:
      context: ./client
      dockerfile: Dockerfile.selenium
    container_name: pastebox-selenium
    environment:
      APP_URL: http://client
    depends_on:
      client:
        condition: service_started
      server:
        condition: service_started
    networks:
      - pastebox-network
    volumes:
      - ./client/test-results:/app/test-results

volumes:
  mongodb_data:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  aws_access_key_id:
    file: ./secrets/aws_access_key_id.txt
  aws_secret_access_key:
    file: ./secrets/aws_secret_access_key.txt
  mail_user:
    file: ./secrets/mail_user.txt
  mail_pass:
    file: ./secrets/mail_pass.txt
