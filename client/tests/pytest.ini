[pytest]
# Pytest configuration for Selenium tests

# Markers
markers =
    smoke: Smoke tests - quick validation of core functionality
    regression: Regression tests - full feature testing
    ui: UI tests - frontend validation
    integration: Integration tests
    slow: Slow running tests
    skip: Skip tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --capture=no
    --maxfail=3

# Timeouts
timeout = 300

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s

# Coverage
[coverage:run]
source = .
omit = 
    */site-packages/*
    */distutils/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
